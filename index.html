<title>Zong ZHomeFi – 5G Experience Counter (3D Mockup)</title>
<style>
:root{--bg:#f4f1f3;--fg:#1b1b1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#c{flex:1;min-height:0}canvas{display:block}

<header><h1>Zong ZHomeFi · 5G Experience Counter</h1>
<button onclick="V(0)">3D view</button><button onclick="V(1)">Front</button><button onclick="V(2)">Top</button><button onclick="V(3)">Close‑up</button><button class="g" onclick="LB()">Labels</button><button class="s" id="sb" onclick="SB()">Sizes: OFF</button></header>

<script>
const M='#e6007e',G='#8dc63f',F=.3048,TOP=.76;
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};
const rr=(x,a,b,w,h,r,f)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fillStyle=f;x.fill()};
let MAP=null;const tx=(x,s,a,b,z,c,al='left',w=700)=>{x.font=w+' '+z+'px Arial,Helvetica,sans-serif';x.fillStyle=(MAP&&MAP[c])||c;x.textAlign=al;x.textBaseline='middle';x.fillText(s,a,b)};
const logo=(x,a,b,s)=>{rr(x,a,b,s*3.3,s,s/2,G);tx(x,'ZONG',a+s*.3,b+s*.53,s*.56,'#ffffff','left',900);rr(x,a+s*2.05,b+s*.12,s*1.1,s*.76,s*.38,'#fff');tx(x,'5G',a+s*2.6,b+s*.52,s*.5,M,'center',900)};
const zh=(x,cx,cy,z,c)=>{x.font='800 '+z+'px Arial';const a=x.measureText('ZHome').width,b=x.measureText('Fi').width,s=cx-(a+b)/2;tx(x,'ZHome',s,cy,z,c,'left',800);tx(x,'Fi',s+a,cy,z,G,'left',800)};
const bg=(x,W,H,a,b)=>{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H)};
const glow=(x,cx,cy,r,c)=>{const g=x.createRadialGradient(cx,cy,10,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,x.canvas.width,x.canvas.height)};

const host=document.getElementById('c');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;host.appendChild(R.domElement);

const oc=new THREE.OrbitControls(cam,R.domElement);oc.maxPolarAngle=1.52;oc.minDistance=1;oc.maxDistance=14;oc.enableDamping=true;
sc.add(new THREE.HemisphereLight(0xffffff,0xb9aab4,.8));

const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.05},o));
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const add=(g,m,x,y,z,p=sc)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const scr=(w,h,t,p,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));m.position.set(0,y,z);p.add(m)};

/* room – wall front face at z = 0 */
add(B(20,.02,14),mat(0xe9e6e9,{roughness:.25}),0,-.01,3);
add(B(14,3,.1),mat(0xf0ecf0),0,1.5,-.05);

/* ---- T counter (feet): wall run 1.5 ft deep, 3 ft left + 4.5 ft right of a 1.5 ft wide stem that projects 6 ft from the wall ---- */
const out=[[5.25,0],[5.25,1.5],[.75,1.5],[.6,5.4]];
for(let i=1;i<=24;i++){const a=Math.PI*i/24;out.push([.6*Math.cos(a),5.4+.6*Math.sin(a)])}
out.push([-.75,1.5],[-3.75,1.5],[-3.75,0]);
const pm=out.map(q=>[q[0]*F,q[1]*F]);
const S=new THREE.Shape(pm.map(p=>new THREE.Vector2(p[0],-p[1])));
const ex=d=>{const g=new THREE.ExtrudeGeometry(S,{depth:d,bevelEnabled:false});g.rotateX(-Math.PI/2);return g};
add(ex(TOP-.04),mat(0xf3f3f3,{roughness:.6}),0,0,0);
add(ex(.04),mat(0xffffff,{roughness:.15}),0,TOP-.04,0);

/* branding wrapped continuously around the cabinet fronts (door 1.5 ft × 2 ft, with gaps + handles) */
const baseT=(x,W,H)=>{bg(x,W,H,'#ffffff','#ffd9ec');for(let i=0;i<W/(H*.9);i++){const a=i*H*.9+H*.2;x.fillStyle=i%2?'rgba(141,198,63,.16)':'rgba(230,0,126,.13)';x.beginPath();x.moveTo(a,0);x.lineTo(a+H*.35,0);x.lineTo(a-H*.15,H);x.lineTo(a-H*.5,H);x.fill()}x.fillStyle=G;x.fillRect(0,H*.9,W,H*.035);x.fillStyle=M;x.fillRect(0,H*.935,W,H*.065)};
const doorT=(x,W,H,n,skip)=>{const dw=W/n;for(let k=0;k<n;k++){if(k){x.fillStyle='rgba(150,0,90,.35)';x.fillRect(k*dw-3,0,6,H)}if(k!==skip)rr(x,(k+1)*dw-dw*.13,H*.1,11,H*.2,5,'#a9a9b4')}};
function rib(pf,n,skip,draw){const y0=.08,y1=y0+2*F,p=pf.map(q=>[q[0]*F,q[1]*F]),s=[0];
 for(let i=1;i<p.length;i++)s.push(s[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));const Ln=s[s.length-1];
 const t=cv(Math.round(Ln*900),Math.round((y1-y0)*900),(x,W,H)=>{baseT(x,W,H);MAP={'#fff':M,'#f6a6d3':'#4a1238','#8dc63f':'#5b9410'};draw(x,W,H);MAP=null;doorT(x,W,H,n,skip)});
 const pos=[],uv=[],idx=[];
 p.forEach((q,i)=>{const a=p[Math.max(i-1,0)],b=p[Math.min(i+1,p.length-1)];let tx_=b[0]-a[0],tz=b[1]-a[1];const l=Math.hypot(tx_,tz);tx_/=l;tz/=l;const nx=-tz*.003,nz=tx_*.003;
  pos.push(q[0]+nx,y0,q[1]+nz,q[0]+nx,y1,q[1]+nz);uv.push(s[i]/Ln,0,s[i]/Ln,1);if(i)idx.push(2*i-2,2*i,2*i-1,2*i-1,2*i,2*i+1)});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
 sc.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,roughness:.4,side:THREE.DoubleSide})))}
const pts=out.slice(1,-1).reverse(),np=pts.length;
rib(pts.slice(0,2),2,-1,(x,W,H)=>{const d=W/2;logo(x,d/2-1.65*80,H*.14,80);zh(x,d/2,H*.55,64,'#fff');tx(x,'Aisa Hai Future',d*1.5,H*.34,40,'#fff','center',700);tx(x,'Say goodbye to',d*1.5,H*.53,36,'#f6a6d3','center',600);tx(x,'weak signals!',d*1.5,H*.65,36,'#f6a6d3','center',600)});
rib(pts.slice(-2),3,-1,(x,W,H)=>{const d=W/3;[['4G + 5G','supported',''],['4×4','MIMO','supported'],['High‑gain','antenna','better coverage']].forEach((r,i)=>{const c=(i+.5)*d;tx(x,r[0],c,H*.3,60,'#fff','center',800);tx(x,r[1],c,H*.47,56,G,'center',800);tx(x,r[2],c,H*.64,34,'#f6a6d3','center',600)})});
rib(pts.slice(1,np-1),7,3,(x,W,H)=>{const s=100,c=W/2;logo(x,c-1.65*s,H*.13,s);zh(x,c,H*.58,86,'#fff');tx(x,'Aisa Hai Future',c,H*.76,36,'#f6a6d3','center',600);
 [['Pakistan’s first','5G wireless','home internet',W*.2],['Speed · Surveillance','Gaming · 4K video','',W*.82]].forEach(r=>{tx(x,r[0],r[3],H*.36,r[2]?58:52,'#fff','center',800);tx(x,r[1],r[3],H*.52,r[2]?58:52,G,'center',800);if(r[2])tx(x,r[2],r[3],H*.68,58,'#fff','center',800)})});

/* running border line on the counter top (follows the full outline incl. curve) */
function inset(p,d){const n=p.length;return p.map((b,i)=>{const a=p[(i+n-1)%n],c=p[(i+1)%n],e1=[b[0]-a[0],b[1]-a[1]],e2=[c[0]-b[0],c[1]-b[1]],l1=Math.hypot(...e1),l2=Math.hypot(...e2),n1=[-e1[1]/l1,e1[0]/l1],n2=[-e2[1]/l2,e2[0]/l2],k=d/(1+n1[0]*n2[0]+n1[1]*n2[1]);return[b[0]+(n1[0]+n2[0])*k,b[1]+(n1[1]+n2[1])*k]})}
[[.025,M,.013],[.05,G,.007]].forEach(([d,c,w])=>{const q=inset(pm,d),m=mat(c,{roughness:.3,emissive:c,emissiveIntensity:.15});q.forEach((a,i)=>{const b=q[(i+1)%q.length],dx=b[0]-a[0],dz=b[1]-a[1];add(B(w,.006,Math.hypot(dx,dz)+w*.6),m,(a[0]+b[0])/2,TOP+.003,(a[1]+b[1])/2).rotation.y=Math.atan2(dx,dz)})});

/* ZHomeFi tower – at the back */
const tTex=cv(212,800,(x,W,H)=>{logo(x,W*.06,H*.06,W*.265);x.strokeStyle='#777';x.lineWidth=4;x.beginPath();x.arc(W/2,H*.24,40,0,7);x.stroke();tx(x,'5G',W/2,H*.24,34,'#555','center',800);
 zh(x,W/2,H*.42,38,'#333');[['5G','#27b8ff'],['4G','#27b8ff'],['STATUS','#2ee06b']].forEach((l,i)=>{const y=H*(.78+i*.06);x.fillStyle=l[1];x.beginPath();x.arc(W*.3,y,6,0,7);x.fill();tx(x,l[0],W*.3+16,y,18,'#666','left',600)})});
const T=new THREE.Group();T.position.set(0,TOP+.003,.2);T.scale.z=.75;sc.add(T);
add(new THREE.CylinderGeometry(.085,.085,.4,48),mat(0xfafafa,{roughness:.35}),0,.2,0,T);

[0,1,2].forEach(i=>{const t=add(new THREE.TorusGeometry(.035+.03*i,.005,8,28,Math.PI/2),gm,0,1.23,.2);t.rotation.z=Math.PI/4;t.castShadow=false});
add(new THREE.SphereGeometry(.007,12,10),gm,0,1.23,.2);
const gl=new THREE.PointLight(0x7fff3a,.6,1.2);gl.position.set(0,1.3,.35);sc.add(gl);

 x.strokeStyle=M;x.lineWidth=4;rr(x,170,170,170,330,50,'rgba(255,255,255,.12)');x.strokeRect(170,170,170,330);tx(x,'3D MODEL · PERFORMANCE',40,60,34,'#fff');
 [['FPS','144',G],['PING','12 ms',M],['LOAD','38%','#27b8ff']].forEach((r,i)=>{tx(x,r[0],560,170+i*130,26,'#aaa');tx(x,r[1],560,215+i*130,56,r[2],'left',800);rr(x,560,250+i*130,360,10,5,'#333')})});
const tabTex=cv(1100,720,(x,W,H)=>{bg(x,W,H,'#13201c','#0a0e10');x.strokeStyle='#ffffff22';x.lineWidth=2;[1,2].forEach(i=>{x.beginPath();x.moveTo(W/3*i,0);x.lineTo(W/3*i,H);x.moveTo(0,H/3*i);x.lineTo(W,H/3*i);x.stroke()});
 x.fillStyle='#ff3b3b';x.beginPath();x.arc(60,60,14,0,7);x.fill();tx(x,'LIVE · CAM 01',90,60,34,'#fff');tx(x,'ZHomeFi 5G',W-40,H-50,30,G,'right');rr(x,380,300,340,260,40,'rgba(255,255,255,.08)')});
const phTex=cv(300,620,(x,W,H)=>{bg(x,W,H,'#14141a','#2c0b22');tx(x,'SPEED TEST',W/2,60,28,'#fff','center');x.lineWidth=22;x.lineCap='round';x.strokeStyle='#333';x.beginPath();x.arc(W/2,300,100,Math.PI*.8,Math.PI*2.2);x.stroke();x.strokeStyle=G;x.beginPath();x.arc(W/2,300,100,Math.PI*.8,Math.PI*1.9);x.stroke();tx(x,'1.2',W/2,295,72,'#fff','center',800);tx(x,'Gbps',W/2,350,28,M,'center');tx(x,'4G · 5G',W/2,520,30,'#fff','center')});
const tvTex=cv(1280,720,(x,W,H)=>{bg(x,W,H,'#0c0c10','#3a0f2e');logo(x,60,50,66);zh(x,420,330,150,'#fff');x.fillStyle=M;x.fillRect(100,430,540,60);tx(x,'PAKISTAN’S FIRST',370,461,36,'#fff','center',800);tx(x,'5G WIRELESS HOME INTERNET',100,540,34,'#f6a6d3');rr(x,900,250,260,200,30,G);tx(x,'4K',1030,350,130,'#111','center',900);tx(x,'ULTRA HD',1030,500,32,'#fff','center')});

/* wall TV (existing, 4K) */
add(B(1.3,.76,.04),mat(0x0b0b0d),0,1.85,.02);scr(1.24,.7,tvTex,sc,1.85,.042);
